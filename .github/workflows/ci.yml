# Integração contínua: a cada push/PR roda lint, formatação, tipos, testes e build.
# Os testes da API sobem um PostgreSQL temporário (embedded-postgres); nenhum segredo é usado.
name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  qualidade:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Instalar dependências
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Formatação
        run: npm run format:check

      - name: Tipos (API)
        run: npm run typecheck -w @reciclaplus/api

      - name: Testes (API + front)
        run: npm test

      - name: Build
        run: npm run build
